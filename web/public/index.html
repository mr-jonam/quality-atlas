<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Eine anbieterneutrale Wissensbasis für QA und Softwaretests.">
    <meta name="theme-color" content="#f4f1e9">
    <title>Quality Atlas</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Zum Inhalt</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Wissensnavigation">
        <div class="brand-block">
          <a class="brand" href="#/doc/docs/00-start/home" aria-label="Quality Atlas home">
            <svg aria-hidden="true" viewBox="0 0 40 40"><path d="M20 3 34 10v20l-14 7-14-7V10l14-7Z"/><path d="m12 15 8-4 8 4v10l-8 4-8-4V15Z"/><path d="M20 11v18M12 15l8 4 8-4"/></svg>
            <span>Quality Atlas<small>QA-Wissenslandkarte</small></span>
          </a>
          <button class="icon-button mobile-only" id="close-nav" type="button" aria-label="Navigation schließen">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <label class="search-box" for="search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
          <input id="search" type="search" placeholder="Dokumentation durchsuchen" autocomplete="off">
          <kbd>/</kbd>
        </label>

        <div class="filters" aria-label="Inhaltsfilter">
          <select id="level-filter" aria-label="Nach Niveau filtern">
            <option value="">Alle Niveaus</option>
          </select>
          <select id="role-filter" aria-label="Nach Rolle filtern">
            <option value="">Alle Rollen</option>
          </select>
        </div>

        <nav id="navigation" class="note-navigation" aria-live="polite">
          <div class="nav-skeleton"><span></span><span></span><span></span><span></span></div>
        </nav>

        <div class="sidebar-foot">
          <span id="note-count">Notizen werden geladen</span>
          <a href="https://github.com/mr-jonam/quality-atlas" target="_blank" rel="noreferrer">Repository</a>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <button class="icon-button mobile-only" id="open-nav" type="button" aria-label="Navigation öffnen">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="crumb" id="crumb">Wissensbasis</div>
          <div class="top-actions">
            <button class="text-button" id="copy-link" type="button">Link kopieren</button>
            <button class="icon-button" id="theme-toggle" type="button" aria-label="Farbschema wechseln">
              <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.5A8 8 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>
            </button>
          </div>
        </header>

        <div class="reading-progress" aria-hidden="true"><span id="reading-progress"></span></div>
        <main id="content" class="content" tabindex="-1">
          <div class="content-skeleton" aria-label="Inhalt wird geladen">
            <span class="wide"></span><span></span><span></span><span class="short"></span>
          </div>
        </main>
        <footer class="page-footer">
          <span>Allgemeines Lernmaterial ohne proprietäre Anleitungen.</span>
          <a id="source-link" href="https://github.com/mr-jonam/quality-atlas" target="_blank" rel="noreferrer">Quelle anzeigen</a>
        </footer>
      </div>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
